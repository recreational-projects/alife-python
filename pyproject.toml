[project]
name = "alife-python"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "colorama==0.4.6",
    "uvloop==0.21.0 ; sys_platform != 'win32'",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.14.14",
]

[tool.ruff]
line-length = 127

[tool.ruff.lint]
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.
select = [
    "ANN",
#    "C901",
    "E",
    "F",
    "W",
]
ignore = [
    "E501",
    "E701",
    "F401",
    "F403",
]

[tool.ruff.lint.per-file-ignores]
"test*.py" = [
    "ANN001",
    "ANN201",
]

[tool.setuptools]
py-modules = []
